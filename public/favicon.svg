<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Xin Shen">
  <!--
    fill="none" on the stroked group is load-bearing: SVG defaults <path> fill
    to black, and the two chevrons enclose an area, so without it the mark
    renders with a solid black diamond behind the node.
  -->
  <defs>
    <linearGradient id="g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2997ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#060912"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#202a47"/>
  <g fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M18 20 L32 32 L18 44"/>
    <path d="M46 20 L32 32 L46 44"/>
  </g>
  <g fill="url(#g)" stroke="none">
    <circle cx="32" cy="32" r="4.5"/>
    <circle cx="18" cy="20" r="2.75"/>
    <circle cx="18" cy="44" r="2.75"/>
    <circle cx="46" cy="20" r="2.75"/>
    <circle cx="46" cy="44" r="2.75"/>
  </g>
</svg>
