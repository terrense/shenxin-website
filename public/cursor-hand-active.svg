<svg xmlns="http://www.w3.org/2000/svg" width="26" height="42" viewBox="-0.6 0.8 21.2 35.4">
  <!--
    Interactive variant of the cursor, used on links and buttons.

    Replacing the arrow with a pointing hand everywhere would throw away the
    one piece of feedback a cursor normally gives: whether the thing under it
    is clickable. This keeps that signal — same hand, plus an accent halo and
    a lit fingertip — so hovering a link still reads as "this responds".
  -->
  <defs>
    <linearGradient id="metal-a" x1="4" y1="2" x2="20" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#d7dde9"/>
      <stop offset="1" stop-color="#97a3ba"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0071e3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo behind the fingertip: the "armed" state. -->
  <circle cx="8.7" cy="4.4" r="6.6" fill="url(#halo)"/>

  <g stroke="#11141a" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M6.6 2.6 L10.8 2.6 L11.5 11 L6.1 11 Z" fill="url(#metal-a)"/>
    <path d="M6.1 11.4 L11.5 11.4 L12 17.4 L5.7 17.4 Z" fill="url(#metal-a)"/>
    <path d="M5.4 18 L12.6 18 L14.9 20.3 L14.9 27.5
             A6.5 6.5 0 0 1 8.4 34 L7.6 34
             A5.5 5.5 0 0 1 2.1 28.5 L2.1 20.5 Z" fill="url(#metal-a)"/>
    <path d="M14.7 22.4 L17.9 22.4 A2.05 2.05 0 0 1 17.9 26.5 L14.9 26.5" fill="url(#metal-a)"/>
    <path d="M14.9 26.7 L17.1 26.7 A2.05 2.05 0 0 1 17.1 30.8 L13.9 30.8" fill="url(#metal-a)"/>
  </g>

  <!-- Lit fingertip pad, plus the same joint pins as the default cursor. -->
  <rect x="7.2" y="3.4" width="3.2" height="2.4" rx="1.1" fill="#0071e3"/>
  <g fill="#0071e3">
    <circle cx="8.8" cy="11.2" r="1.25"/>
    <circle cx="8.9" cy="17.6" r="1.25"/>
    <circle cx="8.4" cy="25.6" r="1.7"/>
  </g>
</svg>
